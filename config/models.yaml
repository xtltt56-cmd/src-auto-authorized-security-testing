    "openai": {
      "enabled": false,
      "manual_only": true,
      "protocol": "openai_responses",
      "endpoint": "https://api.openai.com/v1/responses",
      "model": "gpt-5.6-luna",
      "key_env": "OPENAI_API_KEY",
      "timeout_seconds": 60,
      "max_input_tokens": 2000,
      "max_output_tokens": 256,
      "input_usd_per_million": 0.2,
      "output_usd_per_million": 1.2
