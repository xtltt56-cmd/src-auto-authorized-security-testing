{
  "default_lane": "primary",
  "lanes": {
    "bulk": {"provider": "ollama", "model": "qwen-agent-stable:30b", "endpoint": "http://127.0.0.1:11434", "timeout_seconds": 120, "estimated_cost": 0, "enabled": true},
    "primary": {"provider": "ollama", "model": "qwen-agent-stable:30b", "endpoint": "http://127.0.0.1:11434", "timeout_seconds": 120, "estimated_cost": 0, "enabled": true},
    "expert": {"provider": "ollama", "model": "qwen3-coder:30b", "endpoint": "http://127.0.0.1:11434", "timeout_seconds": 90, "estimated_cost": 0, "enabled": true}
