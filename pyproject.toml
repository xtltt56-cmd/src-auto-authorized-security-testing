[project]
name = "src-auto-authorized-security-testing"
version = "0.9.0"
description = "授权范围门控的安全测试编排与候选漏洞研判平台"
requires-python = ">=3.8"
dependencies = []

[tool.src-auto]
default-language = "zh-CN"
network-default = "loopback-only"

[tool.coverage.run]
branch = true
source = ["src_auto"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 68
