name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Python tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $failures = @()
          Get-ChildItem -Recurse -File -Filter *.ps1 | Where-Object { $_.FullName -notmatch '[\\/](artifacts|vendor|runtime)[\\/]' } | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if($errors.Count -gt 0){ $failures += $_.FullName }
          }
          if($failures.Count -gt 0){ throw "PowerShell syntax failures: $($failures -join ', ')" }

      - name: Install Dashboard dependencies
        shell: pwsh
        run: npm ci --prefix dashboard

      - name: Dashboard lint
        shell: pwsh
        run: npm run lint --prefix dashboard

      - name: Dashboard unit tests
        shell: pwsh
        run: npm run test --prefix dashboard

      - name: Dashboard production build
        shell: pwsh
        run: npm run build --prefix dashboard

      - name: Install Chromium
        shell: pwsh
        run: npx --prefix dashboard playwright install chromium

      - name: Dashboard browser tests
        shell: pwsh
        run: npm run e2e --prefix dashboard

      - name: Tracked secret signature check
        shell: pwsh
        run: |
          $pattern = 'sk-or-v1-[A-Za-z0-9_-]{24,}|sk-[0-9A-Fa-f]{32,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----'
          $paths = @(git grep -I -l -E $pattern -- . 2>$null)
          $grepExit = $LASTEXITCODE
          if($paths.Count -gt 0){ throw "疑似凭据文件：$($paths -join ', ')" }
          if($grepExit -eq 1){ Write-Host '未发现疑似凭据。'; exit 0 }
          if($grepExit -ne 0){ throw "git grep 执行失败，退出码：$grepExit" }
