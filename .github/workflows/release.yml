name: Build and publish latest Windows release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: src-auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Resolve and verify version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if($version -notmatch '^\d+\.\d+\.\d+$'){ throw "Invalid VERSION: $version" }
          $tag = "v$version"
          if("${{ github.ref_type }}" -eq 'tag' -and "${{ github.ref_name }}" -ne $tag){
            throw "Tag ${{ github.ref_name }} does not match VERSION $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Python tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $failures = @()
          Get-ChildItem -Recurse -File -Filter *.ps1 | Where-Object { $_.FullName -notmatch '[\\/](artifacts|vendor|runtime)[\\/]' } | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if($errors.Count -gt 0){ $failures += $_.FullName }
          }
          if($failures.Count -gt 0){ throw "PowerShell syntax failures: $($failures -join ', ')" }

      - name: Build and test Dashboard
        shell: pwsh
        run: |
          npm ci --prefix dashboard
          npm run lint --prefix dashboard
          npm run test --prefix dashboard
          npm run build --prefix dashboard
          npx --prefix dashboard playwright install chromium
          npm run e2e --prefix dashboard

      - name: Tracked secret signature check
        shell: pwsh
        run: |
          $pattern = 'sk-or-v1-[A-Za-z0-9_-]{24,}|sk-[0-9A-Fa-f]{32,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----'
          $paths = @(git grep -I -l -E $pattern -- . 2>$null)
          $grepExit = $LASTEXITCODE
          if($paths.Count -gt 0){ throw "疑似凭据文件：$($paths -join ', ')" }
          if($grepExit -eq 1){ Write-Host '未发现疑似凭据。' }
          elseif($grepExit -ne 0){ throw "git grep 执行失败，退出码：$grepExit" }

      - name: Build Windows distribution
        shell: pwsh
        run: |
          $pythonRoot = (python -c "import sys; print(sys.base_prefix)").Trim()
          ./tools/build_windows_release.ps1 -PythonRuntimePath $pythonRoot -SkipDashboardBuild

      - name: Verify packaged runtime
        shell: pwsh
        run: |
          $verifyRoot = Join-Path $env:RUNNER_TEMP 'src-auto-release-verify'
          Expand-Archive -LiteralPath artifacts/release/SRC-Auto-Windows-x64.zip -DestinationPath $verifyRoot
          $app = Join-Path $verifyRoot 'SRC-Auto'
          & (Join-Path $app 'runtime/python/python.exe') -m src_auto --help | Out-Null
          if($LASTEXITCODE -ne 0){ throw 'Packaged Python runtime cannot start SRC-Auto.' }
          $expected = Get-Content artifacts/release/SHA256SUMS.txt
          if($expected.Count -ne 2){ throw 'SHA256SUMS.txt is incomplete.' }

      - name: Create version tag when main is published
        if: github.ref_type != 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          git fetch --tags --force
          $existing = git rev-parse -q --verify "refs/tags/$tag" 2>$null
          if($LASTEXITCODE -eq 0){
            if($existing.Trim() -ne (git rev-parse HEAD).Trim()){ throw "$tag already points to another commit; update VERSION." }
          } else {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a $tag -m "SRC-Auto $tag"
            git push origin $tag
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $assets = @(
            'artifacts/release/SRC-Auto-Windows-x64.zip',
            'artifacts/release/SRC-Auto-Windows-x64-v${{ steps.version.outputs.version }}.zip',
            'artifacts/release/SHA256SUMS.txt',
            'artifacts/release/release-manifest.json'
          )
          if(gh release view $tag --repo '${{ github.repository }}' 2>$null){
            gh release upload $tag @assets --repo '${{ github.repository }}' --clobber
            gh release edit $tag --repo '${{ github.repository }}' --latest
          } else {
            gh release create $tag @assets --repo '${{ github.repository }}' --verify-tag --title "SRC-Auto $tag" --generate-notes --latest
          }
